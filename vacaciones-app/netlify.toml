# ═══════════════════════════════════════════════════════════════
# netlify.toml — Configuración de despliegue en Netlify
# ═══════════════════════════════════════════════════════════════

[build]
  # No hay proceso de build (HTML/CSS/JS puro)
  publish = "."

# Redirige todas las rutas al index.html (SPA)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Cabeceras de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    # Permite que AutoFirma (localhost:51234) pueda comunicarse con la app
    Content-Security-Policy = "default-src 'self' https://*.supabase.co; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://127.0.0.1:8080 https://127.0.0.1:8080; img-src 'self' data: blob:; frame-src 'none';"

# Cache para assets estáticos
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
