# ═══════════════════════════════════════════════════════════════
# netlify.toml — Configuración de despliegue en Netlify
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "."

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self' https://*.supabase.co; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com https://administracionelectronica.gob.es https://sede.carm.es; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://administracionelectronica.gob.es https://sede.carm.es https://127.0.0.1:* http://127.0.0.1:* wss://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data: blob:; frame-src 'none';"
    
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
